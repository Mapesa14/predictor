<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e3" />
    <meta name="description" content="Football score and betting-market predictions — why, not tips" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Mono&family=Source+Sans+3:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />

    <title>Football Predictor</title>
  </head>
  <body>
    <div id="root">
      <!-- Painted before the app's script runs, then replaced by it. -->
      <div class="boot" aria-hidden="true">
        <header class="masthead"><div><h1>Football <b>Predictor</b></h1></div></header>
        <span class="bone" style="height: 32px; margin-top: 14px"></span>
        <span class="bone" style="width: 150px; height: 13px; margin-top: 28px"></span>
        <span class="bone" style="height: 22px; margin-top: 14px"></span>
        <span class="bone" style="height: 22px; margin-top: 12px"></span>
        <span class="bone" style="height: 22px; margin-top: 12px"></span>
        <span class="bone" style="width: 110px; height: 13px; margin-top: 28px"></span>
        <span class="bone" style="height: 22px; margin-top: 14px"></span>
        <span class="bone" style="height: 22px; margin-top: 12px"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
