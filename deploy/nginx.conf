# Serves the built web app and puts the API on the same origin.
#
# Same-origin matters: the browser build calls relative /api/... paths, so no
# CORS and no configuration. (The phone app is the opposite case — it has no
# shared origin and must be given an absolute https base. See MOBILE.md.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold slate can take a few seconds while the models warm up.
        proxy_read_timeout 120s;
    }

    # Hashed asset filenames, so they can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or a deploy cannot reach anyone:
    # the stale worker keeps serving the old build from its own cache.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
